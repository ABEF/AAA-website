# Separate poplint site. Install only after DNS and its own certificate are ready.
# This template does not edit, include or redirect the popldemo virtual host.
server {
    listen 80;
    server_name poplint.0xwave.com www.poplint.0xwave.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/popl-integration/acme;
        try_files $uri =404;
    }
    location / { return 301 https://www.poplint.0xwave.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name poplint.0xwave.com;
    ssl_certificate /etc/letsencrypt/live/popl-integration/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/popl-integration/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.poplint.0xwave.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.poplint.0xwave.com;
    ssl_certificate /etc/letsencrypt/live/popl-integration/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/popl-integration/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/popl-integration/current;
    index index.html;
    access_log /var/log/nginx/popl-integration-access.log;
    error_log /var/log/nginx/popl-integration-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    # A reviewed external RPC needs explicit operator admission here as well as
    # the immutable manifest. The default unconfigured release makes no requests.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    # No backend is implicitly published by a static integration release.
    location ^~ /api/ { return 503; }
    location ~ /\. { deny all; }
    location ~* \.(?:md|py|sh|env|map|sqlite|db)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
